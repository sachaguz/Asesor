services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asesor
      POSTGRES_PASSWORD: asesor
      POSTGRES_DB: asesor
    # Sin esto, funciones como CURRENT_DATE y func.date(...) en las queries
    # corren en UTC aunque la app ya esté en hora de México — mismo bug que
    # TZ en el servicio `api`, pero del lado de Postgres.
    command: postgres -c timezone=America/Mexico_City
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asesor"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://asesor:asesor@db:5432/asesor
      # Sin esto el contenedor corre en UTC — `date.today()` (racha,
      # límites diarios de IA, "ayer") queda adelantado respecto al día
      # real del negocio durante buena parte del día en México.
      TZ: America/Mexico_City
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
