[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asesor"
version = "0.1.0"
description = "El Asesor - backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "anthropic>=0.69",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "google-auth>=2.34",
    "requests>=2.32",
    "stripe>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
